.item strong{font-size:17px} .next{font-weight:800;color:#1565c0;margin:12px 0 5px}

lines.forEach(x=>{let b=document.createElement("button");b.className="chip"+(x==="ALL"?" active":"");b.textContent=x==="ALL"?"すべて":x+"路線";b.onclick=()=>{filter=x;[...f.children].forEach(c=>c.classList.remove("active"));b.classList.add("active");render()};f.appendChild(b)});

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
 const root=document.getElementById("list"); root.innerHTML="";
 const grouped=new Map();
 trips.filter(t=>filter==="ALL"||t.line===filter).forEach((t,i)=>{let k=t.line+"|"+t.desc+"|"+t.url;if(!grouped.has(k))grouped.set(k,[]);grouped.get(k).push(t)});
 grouped.forEach((arr,k)=>{const t=arr[0], card=document.createElement("section");card.className="route";
 card.innerHTML=`<h2>${esc(t.line)}　${esc(t.desc)}</h2><div class="desc">${esc(t.group)}</div>`;
 arr.forEach(x=>{const idx=trips.indexOf(x);const b=document.createElement("button");b.className="trip";b.onclick=()=>openTrip(idx);
 b.innerHTML=`<span class="mark">${esc(x.mark)}</span><span><span class="time">${esc(x.times.join("　"))}</span><br><span class="sub">車両ID ${esc(x.vehicle)} ${esc(x.note)}</span></span>`;card.appendChild(b)});
 let a=document.createElement("a");a.className="source";a.href=t.url;a.target="_blank";a.rel="noopener";a.textContent="元のバスロケページを開く ↗";card.appendChild(a);root.appendChild(card)})
}
function openTrip(idx){
 const cur=trips[idx]; const same=trips.filter(t=>t.mark===cur.mark).sort((a,b)=>a.times[0].localeCompare(b.times[0]));
 const pos=same.findIndex(t=>t.line===cur.line&&t.desc===cur.desc&&t.times[0]===cur.times[0]);
 document.getElementById("ptitle").textContent=cur.mark+" の1日運用";
 let out=`<div class="sub">現在の車両ID：${esc(cur.vehicle)}</div>`;
 if(pos>=0 && pos+1<same.length){let n=same[pos+1];out+=`<div class="next">次の運用 → ${esc(n.times[0])}　${esc(n.line)} ${esc(n.desc)}</div>`}
 else out+=`<div class="next">この一覧では次の運用はありません</div>`;
 out+=`<div class="timeline">`;
 same.forEach((t,j)=>{out+=`<div class="item ${j===pos?'current':''}"><strong>${esc(t.times[0])}–${esc(t.times[t.times.length-1])}　${esc(t.line)}</strong><br>${esc(t.desc)}<br><span class="sub">${esc(t.times.join(" → "))}　車両ID ${esc(t.vehicle)} ${esc(t.note)}</span></div>`});
 out+=`</div>`;document.getElementById("pbody").innerHTML=out;document.getElementById("sheet").style.display="flex";
}
function closeSheet(){document.getElementById("sheet").style.display="none"}
render();
</script></body></html>
